---
name: Publish Docker
'on':
  push:
    tags:
      - '*'
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: 0.10.1
      - uses: docker/login-action@v4
        with:
          username: littlegodzillalaboratory
          password: ${{ secrets.LITTLEGODZILLALABORATORY_DOCKERHUB_TOKEN }}
      - uses: cliffano/command-docker-action@v2.1.0
        with:
          image: cliffano/studio:3.8.0
          shell: bash
          extra_args: '-v ~/.docker/config.json:/root/.docker/config.json:ro'
          command: |
            make clean deps lint build-docker &&
            cat logs/packer-build-docker.log &&
            docker --version &&
            docker info  &&
            docker inspect littlegodzillalaboratory/minecraft-npc &&
            make publish-docker
